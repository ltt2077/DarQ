name: Publish DarQ 2.3.0 test release
on:
  push:
    branches: [master]
    paths: ['.github/workflows/darq-2.3.0.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: darq-2.3.0-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 17 SDK
        run: |
          sdk="$RUNNER_TEMP/darq-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl --fail --silent --show-error --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/darq-tools.zip"
          echo "e025545c62a8e64c7559119566a569fb1dec5f60  $RUNNER_TEMP/darq-tools.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/darq-tools.zip" -d "$RUNNER_TEMP/darq-tools"
          mv "$RUNNER_TEMP/darq-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install 'platforms;android-37.0' 'build-tools;37.0.0' < <(yes)
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Build and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Verify APK
        run: |
          apk=DarQ-2.3.0-android17-test.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: DarQ-2.3.0-android17
          path: DarQ-2.3.0-android17-test.apk*
          if-no-files-found: error
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=DarQ-2.3.0-android17-test.apk
          cat > release-notes.md <<'NOTES'
          DarQ 2.3.0 Android 17 测试版，包含启动广播注册和 Sui 初始化修补。Android 17 构建与单元测试通过，荣耀 WIN RT2 的启动和强制深色效果有待实机验证。

          这是调试签名的安装包。包名为 `io.github.ltt2077.darq`，可与原版 DarQ 并存。如果已装此前的 DarQ 测试包且系统提示签名不一致，请先备份设置，再卸载旧测试包并安装这个版本。
          NOTES
          gh release create v2.3.0 "$apk" "$apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'DarQ 2.3.0 · Android 17 测试版' --prerelease --notes-file release-notes.md
