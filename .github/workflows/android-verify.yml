name: Verify DarQ Android build
on:
  push:
    branches: [master]
    paths: ['app/**', 'systemstubs/**', '*.gradle', 'gradle/**', '.github/workflows/android-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 17 SDK
        run: |
          sdk="$RUNNER_TEMP/darq-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl --fail --silent --show-error --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/darq-tools.zip"
          echo "e025545c62a8e64c7559119566a569fb1dec5f60  $RUNNER_TEMP/darq-tools.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/darq-tools.zip" -d "$RUNNER_TEMP/darq-tools"
          mv "$RUNNER_TEMP/darq-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install 'platforms;android-37.0' 'build-tools;37.0.0' < <(yes)
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Build and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
