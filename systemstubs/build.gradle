plugins {
    id 'com.android.library'
}

android {
    namespace 'com.kieronquinn.systemstubs'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        minSdk 29
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
